<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo</title>
<meta name="description" content="Workout, focus, meditation and alarm timers in one simple app.">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/space-grotesk-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/space-grotesk-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Space Grotesk";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2")}
:root{
  --bg:#f5f5f3;--bg2:#ecece9;--card:#ffffff;--ink:#121214;--muted:#6f6f75;--line:#ebebe7;--hair:rgba(18,18,20,.06);--track:#dcdcd7;
  --accent:#121214;--accent-ink:#ffffff;--hi:#d4ff3a;--hi-ink:#121214;--warn:#c0362c;--gold:#121214;
  --tl-w:#121214;--tl-r:#c4c4bf;--tl-g:#e3e3df;
  --t-work:#d4ff3a;--t-work-ink:#121214;--t-rest:#121214;--t-rest-ink:#f5f5f3;--t-ready:#ecece9;--t-ready-ink:#121214;--t-done:#121214;--t-done-ink:#f5f5f3;
  --shadow:0 1px 2px rgba(18,18,20,.04),0 4px 16px rgba(18,18,20,.03);--dot-med:#1b1814;--glass:rgba(245,245,243,.82);
  --r:20px;--r-sm:12px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b0b0c;--bg2:#1b1b1e;--card:#151517;--ink:#f3f3f1;--muted:#9a9aa1;--line:#26262a;--hair:rgba(255,255,255,.06);--track:#38383d;
    --accent:#d4ff3a;--accent-ink:#121214;--warn:#ff8a7a;--gold:#d4ff3a;
    --tl-w:#d4ff3a;--tl-r:#4a4a50;--tl-g:#2a2a2e;
    --t-rest:#222226;--t-rest-ink:#f3f3f1;--t-ready:#1b1b1e;--t-ready-ink:#f3f3f1;--t-done:#151517;--t-done-ink:#f3f3f1;--shadow:none;--dot-med:#e8d5b5;--glass:rgba(11,11,12,.8)}
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.45;cursor:default}
button:not(:disabled):active{transform:scale(.97)}
button,.in,a.btn{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num,h1,.bl,.ttl,.big-num,.pname,.ptitle{font-family:"Space Grotesk",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 180px}
/* page heads */
.phead{display:flex;align-items:flex-end;gap:10px;margin:4px 0 16px;min-height:48px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:1px}
.ptitle{font-size:32px;font-weight:700;line-height:1.08;letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}
.phead .btn{margin-bottom:4px}
.syncdot{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg2);color:var(--muted);flex:none;padding:0;margin-bottom:2px}
.syncdot.ok{color:var(--ink)} .syncdot.bad{color:var(--warn)} .syncdot.busy svg{animation:pulse 1.2s ease-in-out infinite}
.syncdot.lg{width:44px;height:44px;margin:0}
@keyframes pulse{50%{opacity:.35}}
.synchead{display:flex;align-items:center;gap:12px}
.synchead b{font-size:15.5px}
.divider{height:1px;background:var(--line);margin:16px 0 14px}
.steps{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:18px}
.steps li{padding-left:4px}
.steps li>b{display:block;font-size:15.5px;margin-bottom:4px}
.steps .btn,.steps .in{margin:10px 0 8px}
.steps .in{font-family:ui-monospace,Menlo,monospace;font-size:15px}
.banner{background:var(--bg2);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card p{margin:12px 0 14px;line-height:1.5}
.ttl{font-weight:700;font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.warn{color:var(--warn);font-weight:600}
.row2{display:flex;gap:10px}
.grow{flex:1;min-width:0}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.in{width:100%;border:1px solid transparent;background:var(--bg2);color:var(--ink);border-radius:var(--r-sm);padding:11px 12px;font:inherit;font-size:16px;outline:none;min-width:0;-webkit-appearance:none;appearance:none}
.in::placeholder{color:var(--muted);opacity:.8}
.in:focus{border-color:var(--ink);background:var(--card)}
.in:disabled{opacity:1;color:var(--muted);background:transparent;border-color:var(--line)}
.in.search{margin-bottom:2px}
textarea.in{resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.seg{display:flex;background:var(--bg2);border-radius:var(--r-sm);padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.04)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--bg2);color:var(--ink);border-radius:var(--r-sm);padding:11px 15px;font-weight:600;font-size:14.5px;min-height:44px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;color:var(--muted)}
.btn.danger{color:var(--warn)}
.btn.big{width:100%;padding:15px;font-size:16px;margin-top:8px;min-height:52px;border-radius:14px}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px;min-height:36px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1}
.link{border:0;background:none;color:var(--ink);font-weight:600;padding:0;font-size:13px;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px}
/* switches */
.tog input[type=checkbox],.orow input[type=checkbox]{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:14px;background:var(--track);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.tog input[type=checkbox]::before,.orow input[type=checkbox]::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.tog input[type=checkbox]:checked,.orow input[type=checkbox]:checked{background:var(--accent)}
.tog input[type=checkbox]:checked::before,.orow input[type=checkbox]:checked::before{transform:translateX(18px)}
@media (prefers-color-scheme:dark){.tog input[type=checkbox]:checked::before,.orow input[type=checkbox]:checked::before{background:#121214}}
/* blocks */
.bh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.badge{width:30px;height:30px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;flex:none}
.bl{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:440px){.bh.tm .bl{font-size:0}} /* the badge names the superset when the total chip needs the room */
.stepper{display:flex;align-items:center;border-radius:999px;background:var(--bg2)}
.stepper button{width:32px;height:32px;border:0;background:none;font-size:18px;line-height:1;color:var(--ink)}
.stepper span{min-width:62px;text-align:center;font-size:13px;font-weight:600}
.icon{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:10px;font-size:16px;flex:none;display:inline-grid;place-items:center;padding:0}
.icon:hover{background:var(--bg2)}
.icon.star.on{color:var(--gold)}
.ex{border-top:1px solid var(--line);padding:10px 0 6px}
.ex:first-of-type{border-top:0}
.exn{display:flex;align-items:center;gap:4px}
.exn .order{font-size:12px;color:var(--muted);font-weight:700;width:22px;flex:none}
/* drag and drop: the grip and the superset badge are the only handles (touch targets widened by ::after) */
.grip{position:relative;flex:none;width:14px;height:32px;margin-left:-4px;display:grid;place-items:center;color:var(--muted);font-size:13px;letter-spacing:-3px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.grip::after{content:"";position:absolute;inset:0 -9px}
.badge[data-drag]{position:relative;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.badge[data-drag]::after{content:"";position:absolute;inset:-5px}
body.dragging,body.dragging *{cursor:grabbing !important;user-select:none;-webkit-user-select:none}
.dghost{position:fixed;z-index:70;pointer-events:none;margin:0;box-shadow:0 12px 32px rgba(0,0,0,.18)}
.dghost.gex{background:var(--card);border:1px solid var(--hair);border-radius:var(--r-sm);padding-left:10px;padding-right:10px}
.dph{border:1.5px dashed var(--track);border-radius:var(--r-sm)}
.dph.phb{border-radius:var(--r);margin-bottom:12px}
.exn .name{flex:1;text-align:left;border:0;background:none;font-weight:600;padding:4px 0;font-size:15.5px;min-width:0}
.sidetag{flex:none;font-size:11.5px;color:var(--muted);border:1px solid var(--line,var(--bg2));border-radius:999px;padding:1px 7px}
.exn .name.empty{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.hint{font-size:12px;color:var(--muted);margin:0 0 6px 22px}
.excue{font-size:12.5px;line-height:1.35;color:var(--muted);margin:0 0 6px 22px;overflow-wrap:anywhere}
.te-cue{margin:14px 0 4px;text-align:left}
.sets{display:grid;gap:5px;align-items:center;margin-left:22px}
.sets .lab{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.sets .sh{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.sets .in{padding:8px 2px;text-align:center;border-radius:9px}
.addex{border:1.5px dashed var(--track);background:none;border-radius:var(--r-sm);width:100%;padding:11px;color:var(--muted);font-weight:600;margin-top:8px}
.tset{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 6px}
.tset label{font-size:11px;color:var(--muted);font-weight:600;display:block}
.tset .in{margin-top:3px;padding:7px 4px;text-align:center}
.tset.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tog{display:flex;align-items:center;gap:12px;font-weight:500;padding:9px 0;margin:0;min-height:46px;cursor:pointer}
.tog input{order:2;margin-left:auto !important}
.target{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.target .in{width:92px;font-family:"Space Grotesk",system-ui,sans-serif;font-size:24px;font-weight:700;text-align:center;padding:6px}
.fitsum{background:var(--bg2);border-radius:10px;padding:9px 11px;font-size:13px;margin:8px 0}
.wr input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--ink)}
.wr-ends{position:relative;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.wr-mid{position:absolute;left:37.5%;transform:translateX(-50%);padding-top:6px;color:var(--ink)}
.wr-mid::before{content:"";position:absolute;left:50%;top:-4px;height:8px;border-left:1px solid var(--muted)}
.fitsum b{font-family:"Space Grotesk",system-ui,sans-serif}
.totrow{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px}
.totrow b{font-family:"Space Grotesk",system-ui,sans-serif;font-size:22px}
.tl{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:1px;margin:8px 0 4px;background:var(--bg2)}
.tl{touch-action:pan-y;cursor:pointer}
.tl i{display:block;min-width:1px;transition:opacity .12s}
.tl.hassel i:not(.sel){opacity:.35}
.tlstrip{display:block;width:100%;text-align:left;font:inherit;font-weight:600;font-size:14px;color:var(--ink);background:none;border:1px solid var(--line,var(--bg2));border-radius:8px;padding:8px 10px;margin:4px 0}
.tl i.w{background:var(--tl-w)} .tl i.r{background:var(--tl-r)} .tl i.g{background:var(--tl-g)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
/* plans */
.search{display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.fchips button,.cats button{flex:none;border:0;background:var(--bg2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.fchips button.on,.cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fh{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:20px 4px 8px}
.plan{padding:16px}
.ptop{display:flex;align-items:flex-start;gap:6px}
.pname{font-weight:700;font-size:16.5px;line-height:1.25}
.pmeta{font-size:12.5px;color:var(--muted);margin-top:2px}
.pex{font-size:13px;color:var(--muted);margin:6px 0 10px;line-height:1.45}
.pacts{display:flex;gap:6px}
.pacts .btn{flex:1;padding:8px 6px;font-size:13.5px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;vertical-align:1px}
.pill.t{background:var(--ink);color:var(--bg)}
.pill.r{background:var(--bg2);color:var(--ink)}
.based{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:0 2px 10px;flex-wrap:wrap}
.namerow{margin-bottom:10px}
.datein{width:9.2em;flex:none;font-size:15px}
.sets .in{background:var(--bg)}
@media (prefers-color-scheme:dark){.sets .in{background:var(--bg2)}}
.editbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
/* history */
.wh{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.wh .d{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700}
.hb{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.hb h4{margin:8px 0 4px;font-size:13px;color:var(--muted)}
.hl{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.hl span:last-child{color:var(--muted);text-align:right}
.chart{width:100%;height:auto;display:block;margin-top:4px}
table.pt{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.pt td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
table.pt td:first-child{white-space:nowrap;color:var(--muted)}
/* library */
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--bg2);border-radius:999px;padding:5px 5px 5px 12px;font-size:13.5px}
.chip button{border:0;background:none;color:var(--muted);width:20px;height:20px;border-radius:50%;line-height:1;padding:0}
.addrow{display:flex;gap:6px}
/* time chips & time editor */
.tchip{flex:none;gap:3px;border:1px solid var(--line);background:var(--card);color:var(--muted);padding:3px 10px;min-height:30px;font:600 13.5px/1 "Space Grotesk",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.tchip.pin{color:var(--ink);border-color:var(--ink);font-weight:700;padding-left:7px}
.tchip svg{width:14px;height:14px}
.fitsum .tchip,.fitline .tchip{min-height:24px;padding:2px 8px;vertical-align:baseline;font-size:13px}
.fitsum .tchip.pin,.fitline .tchip.pin{padding-left:5px}
.te .lenbig{margin-top:4px}
.te .bignum{font-size:72px}
.te .testat{display:flex;align-items:center;justify-content:center;gap:4px;min-height:20px;margin-bottom:12px}
.te .te-in{text-align:center;font-family:"Space Grotesk",system-ui,sans-serif;font-weight:600}
.te-prev{font-size:13.5px;color:var(--muted);text-align:center;margin:10px 4px 6px;min-height:20px}
.te .btn.big{margin:6px 0 4px}
.te .tog{border-top:1px solid var(--line);margin-top:10px}
.te .acts{margin-top:6px}
.te [hidden]{display:none}
/* sheet */
#sheet{position:fixed;inset:0;z-index:40;display:none}
#sheet.open{display:block}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.36);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:fade .2s ease}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--card);border-radius:26px 26px 0 0;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:rise .28s cubic-bezier(.2,.8,.3,1);padding-bottom:env(safe-area-inset-bottom)}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--track);margin:8px auto 0;flex:none}
#sheet .ph{padding:8px 12px 8px 20px;display:flex;align-items:center;gap:8px}
#sheet .ph b{flex:1;font-family:"Space Grotesk",system-ui,sans-serif;font-size:19px;letter-spacing:-.01em}
#sheet .ph .icon{background:var(--bg2);border-radius:50%;width:32px;height:32px;font-size:13px}
#sheet .pb{padding:4px 20px 24px;overflow:auto}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.plist button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;font-size:15.5px}
.plist h5{margin:14px 0 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.plist .custom{color:var(--ink);font-weight:700}
.cats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
/* toast & rest pill */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.18);font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.undo{pointer-events:auto;width:max-content;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;text-align:left}
#toast button{all:unset;cursor:pointer;flex:none;font-weight:700;text-decoration:underline;padding:4px 2px}
#restpill{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:20;display:none}
#restpill .rp{display:flex;align-items:center;gap:2px;background:var(--ink);color:var(--bg);border-radius:999px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#restpill button{border:0;background:none;color:inherit;font-weight:700;padding:10px 14px;border-radius:999px;display:flex;align-items:center;gap:6px}
#restpill .run{background:var(--hi);color:var(--hi-ink)}

document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const v = f.elements.v.value.trim(); if (!v) return; const L = libCopy();
  if (f.dataset.form === "add-lib") { const c = L.categories[+f.dataset.c]; c.exercises = c.exercises || []; if (!c.exercises.some(x => x.toLowerCase() === v.toLowerCase())) c.exercises.push(v); }
  else if (f.dataset.form === "add-cat") { if (!L.categories.some(c => c.name.toLowerCase() === v.toLowerCase())) L.categories.push({ name: v, exercises: [] }); }
  setLibrary(L);
});
document.addEventListener("input", e => {
  const t = e.target, o = cur();
  if (t.dataset.set !== undefined) dropUndo();
  if (t.id === "pq") { S.pickQ = t.value; renderPicker(); return; }

  if ("teCue" in t.dataset) { // save as you type; the editor line under the exercise follows without a re-render (which would drop focus)

    const c = cueOf(t.value); if (c) ex.cue = c; else delete ex.cue; touch(o);
    const row = $(`#tc${S.te.b}-${S.te.e}`)?.closest(".ex"); if (!row) return;
    let n = row.querySelector(".excue");
    if (!c) { if (n) n.remove(); return; }
    if (!n) { n = document.createElement("div"); n.className = "excue"; row.querySelector(".exn").after(n); }
    n.textContent = c; return;
  }
  if (t.dataset.stext) { S.settings = Object.assign({}, S.settings, { [t.dataset.stext]: t.value }); saveSettingsSoon(); return; }
  if ("ftask" in t.dataset) { if (T) T.task = t.value; S.settings = Object.assign({}, S.settings, { focusTask: t.value }); saveSettingsSoon(); return; }
  if ("dnote" in t.dataset) { if (T && T.doneData) T.doneData.notes = t.value; return; }
  if (t.id === "wq") { S.wq = t.value; render(); return; }

    const k = t.dataset.bind;
    if (k === "warmup.name" || k === "cooldown.name") { const g = o[k.split(".")[0]]; if (g) { g.name = t.value; touch(o); updTimerUI(); } return; }
    if (k === "restsOn" || k === "autoFit" || k === "logReps") { o[k] = t.checked; touch(o); render(); return; }
    if (k === "targetMin") o.autoFit = true;
    if (k === "date") o.dateSet = true;
    if (k === "restScale") { const v = num(t.value); if (v != null) o.restScale = v; touch(o); updTimerUI(); return; }
    if (k === "restBlock" || k === "ready") o[k] = t.value.replace(/[^0-9]/g, "");
    else if (k === "targetMin") o[k] = t.value.replace(/[^0-9.]/g, "");
    else o[k] = t.value;
    touch(o); updTimerUI(); return;
  }
  if (t.dataset.set) { const [b, x, s, f] = t.dataset.set.split(","); S.draft.blocks[+b].exercises[+x].sets[+s][f] = t.value; if (!S.draft.startedAt) S.draft.startedAt = Date.now(); saveDraftSoon(); return; }

  if (t.dataset.blk) { const [b, f] = t.dataset.blk.split(","); if (f === "total") return; o.blocks[+b][f] = t.value.replace(/[^0-9]/g, ""); touch(o); updTimerUI(); return; }

document.addEventListener("change", e => {
  const t = e.target, o = cur();

  if (t.id === "import-file" && t.files && t.files[0]) { const f = t.files[0]; t.value = ""; f.text().then(txt => importCSV(txt, f.name)); return; }
  if (t.id === "restore-file" && t.files && t.files[0]) {
    const f = t.files[0]; t.value = "";
    f.text().then(txt => { let data; try { data = JSON.parse(txt); } catch { toast("That file isn't a Tempo backup."); return; }
      if (!data || typeof data.db !== "object") { toast("That file isn't a Tempo backup."); return; }
      const n = Object.keys(data.db).filter(k => k.startsWith("workouts/")).length;
      confirmSheet(`Replace everything on this device${Sync.on() ? " and your synced devices" : ""} with the backup from ${String(data.exportedAt || "").slice(0, 10) || "that file"}? It has ${n} logged session${n === 1 ? "" : "s"}.`, "Restore", () => {
        S.db.importAll(data.db); if (data.sounds) restoreSounds(data.sounds); dropUndo(); if (data.draft) { S.draft = normDraft(data.draft) || S.draft; lsSet("wt.draft", S.draft); } toast("Backup restored"); render(); }, true); });
    return;

  if ("atime" in t.dataset) { if (/^\d{2}:\d{2}$/.test(t.value)) setSetting("alarmTime", t.value); return; }

});
function updTimerUI() {

document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet").classList.contains("open")) closeSheet(); if (e.key === "Enter" && e.target.dataset && "teIn" in e.target.dataset) e.target.blur(); if (e.key === " " && T && !T.done && !T.ask && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); togglePause(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.soon(300); else if (Sync.pending) Sync.now();
  if (document.visibilityState === "visible" && AL) wakeOn();

["touchend", "click"].forEach(ev => $("#alarm").addEventListener(ev, ensureAudio)); // any tap here unlocks sound, which a reload leaves locked

[["today", "today"], ["plans", "list"], ["history", "clock"], ["settings", "gear"]].forEach(([t, i]) => { const b = $("#nb-" + t); b.innerHTML = IC[i] + `<span>${b.textContent}</span>`; });
